<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Typing Master</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>⚡ Typing Master</h1>
        <div class="controls">
            <button onclick="setTime(30)">30s</button>
            <button onclick="setTime(60)">60s</button>
            <button onclick="toggleTheme()">🌙</button>
        </div>
    </div>

    <!-- PROGRESS BAR -->
    <div class="progress-bar">
        <div id="progress"></div>
    </div>

    <!-- STATS -->
    <div class="stats-card">
        <span>⏱ <span id="time">30</span>s</span>
        <span>⚡ <span id="wpm">0</span> WPM</span>
        <span>🎯 <span id="accuracy">100</span>%</span>
    </div>

    <!-- TEXT -->
    <div class="text-box" id="text"></div>

    <!-- INPUT -->
    <textarea id="input" placeholder="Start typing..." oninput="handleTyping()"></textarea>

    <!-- RESULT -->
    <div id="result" class="result hidden"></div>

</div>

<script src="script.js"></script>
</body>
</html>
